# Compose extra para crear y usar instancia de mongodb local
#     Ejecutar con: docker compose -f compose.yaml -f compose.local.yaml up --build
services:
  backend:
    environment:
      MONGODB_URI: mongodb://mongodb:27017/
      MONGODB_DB: 'educacionrural'
    depends_on:
      - mongodb

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
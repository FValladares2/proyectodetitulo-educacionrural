# Compose extra para crear y usar instancia de mongodb local, con respaldos diarios
#     Ejecutar con: docker compose -f compose.yaml -f compose.local.yaml up -d --build
services:
  backend:
    environment:
      MONGODB_URI: mongodb://mongodb:27017/
      MONGODB_DB: 'educacionrural'
    depends_on:
      - mongodb

  mongodb:
    # versión mayor fija: una versión nueva de MongoDB podría no abrir los datos existentes
    image: docker.io/library/mongo:8
    restart: unless-stopped
    # publicado solo en el propio equipo (para pruebas de integración y herramientas locales),
    # no en la red: el resto de los servicios lo usa dentro de la red de Docker
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db

  respaldo:
    image: docker.io/library/mongo:8
    restart: unless-stopped
    depends_on:
      - mongodb
    environment:
      MONGODB_URI: mongodb://mongodb:27017/
      MONGODB_DB: 'educacionrural'
      RESPALDO_INTERVALO_HORAS: 24
      RESPALDO_RETENCION_DIAS: 7
    # ":z" permite el acceso a las carpetas montadas con SELinux activo (Podman en Fedora/RHEL);
    # Docker lo ignora si SELinux no está activo
    volumes:
      - ./respaldos:/respaldos:z
      - ./scripts/respaldo.sh:/respaldo.sh:ro,z
    entrypoint: ["/bin/sh", "/respaldo.sh"]

volumes:
  mongo_data:

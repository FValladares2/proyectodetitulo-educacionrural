services:
  frontend:
    image: educacionrural-frontend
    build:
      context: ./frontend 
      dockerfile: ./Dockerfile
    environment:
      NODE_ENV: production
    depends_on:
      - backend
    ports:
      - 8065:8065

  backend:
    image: educacionrural-backend
    build:
      context: ./backend
      dockerfile: ./Dockerfile
    environment:
      NODE_ENV: production
      PORT: 8064
    env_file:
      - ./backend/.env
    ports:
      - 8064:8064
